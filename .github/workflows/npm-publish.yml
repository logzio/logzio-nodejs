name: Release New logzio-nodejs Library Version

permissions:
  id-token: write # Required for OIDC
  contents: read

on:
  release:
    types:
     - published
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm test
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: '' # Clear setup-node default to allow OIDC Trusted Publishing
